# Java4Shell (CVE-2026-114938): keep the vulnerable Base64 intrinsic out of the
# build daemon until every local JDK is on a fixed build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:-UseBASE64Intrinsics
kotlin.daemon.jvmargs=-XX:-UseBASE64Intrinsics
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.suppressUnsupportedCompileSdk=36

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
