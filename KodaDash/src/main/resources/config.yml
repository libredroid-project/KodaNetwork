# ============================================
# KodaDash Configuration
# Secure Remote Control Panel for KodaHosting
# ============================================

# Port for the web dashboard (HTTP + SSE)
port: 7867

# Allowed origins for CORS (comma-separated)
# Set to * for development, restrict to your domain in production
cors-origins: "https://kodahosting.com,http://localhost:3000"

# Auto-generated API token (DO NOT SHARE)
# This token is used by the KodaHosting website to authenticate.
# It is generated automatically on first startup.
# Use /kodadash regenerate to create a new one.
api-token: ""

# Optional secondary password (BCrypt hash)
# Set via /kodadash setpassword <password>
# Leave empty to disable secondary password
password-hash: ""

# Rate limiting
rate-limit:
  # Maximum requests per minute per IP
  max-requests: 120
  # Auth endpoint: max attempts per minute per IP
  max-auth-attempts: 10

# Maximum file size for uploads (in bytes, default 10MB)
max-upload-size: 10485760

# Maximum number of console lines to keep in memory
console-buffer-size: 500

# Paths that are blocked from the file browser (relative to server dir)
blocked-paths:
  - "plugins/KodaDash/config.yml"
  - "whitelist.json"
  - "banned-players.json"
  - "banned-ips.json"
  - "ops.json"

# Commands that are blocked from being executed via the console.
# Leading slashes are stripped, so "/stop" hits the entry "stop" as well.
blocked-commands:
  - "stop"
  - "restart"
  - "reload"
  - "kodadash"
  - "op"
  - "deop"
  - "ban"
  - "ban-ip"
  - "pardon"
  - "pardon-ip"
  - "kick"
  - "save-off"
  - "save-all"
  - "whitelist"
  - "bukkit:reload"
  - "bukkit:stop"
  - "minecraft:stop"

# Deliberate server control from the dashboard (restart/stop with player countdown
# and a cancel option). These stay blocked in the console - only this route may use them.
server-actions:
  enabled: true
  # Seconds between the request and the action (broadcast to all players)
  countdown-seconds: 30
  # Allow "stop" (shuts the server down); restart is always available when enabled
  allow-stop: true

# Live stats for the companion app (plugins/KodaDash/stats.json).
# This is what the app reads for the server card, so it does not have to run the "tps"
# command in the console every few seconds (which printed a line each time).
stats-file:
  enabled: true
  interval-seconds: 10

# Rolling history for the dashboard charts (kept in memory, one series per server run).
stats-history:
  enabled: true
  interval-seconds: 10
  minutes: 60

# Scheduled automation (dashboard -> Settings -> Automation).
# Jobs live in plugins/KodaDash/schedule.json.
schedule:
  enabled: true
  # Jobs are created and executed by the KodaHosting app (it mirrors them here for display).
  # Set this to true only if the dashboard should run the jobs itself.
  execute: false
  # How long before a scheduled restart/stop players are warned (seconds)
  warn-seconds: 300
  # Countdown used when a scheduled restart/stop fires
  restart-countdown-seconds: 15

# Power saving: lower the view distance while nobody is online.
efficiency:
  enabled: false
  idle-minutes: 10
  view-distance: 4
  simulation-distance: 4
